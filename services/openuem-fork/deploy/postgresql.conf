# Dedicated internal network; systemd proxy binds127.0.0.1:15432, noDockerNAT.
listen_addresses = '*'
port = 5432
unix_socket_directories = '/run/postgresql'
unix_socket_permissions = 0700
hba_file = '/etc/railtime/pg_hba.conf'
password_encryption = 'scram-sha-256'
max_connections = 40
shared_buffers = '128MB'
work_mem = '4MB'
maintenance_work_mem = '64MB'
max_wal_size = '1GB'
min_wal_size = '80MB'
fsync = on
full_page_writes = on
synchronous_commit = on
log_statement = 'none'
log_min_error_statement = 'panic'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
logging_collector = off
log_connections = off
log_disconnections = off
ssl = off
# TCP is only local Docker bridge/host loopback. Remote DB access requires TLS
# verify-full and a separately reviewed configuration, never changing only ports.
