# RailTime E3 / C-K17 - configuration REVIEW, 2026-11-04
# STATUS: INACTIVE / NOT INSTALLABLE / NOT A COMPLETE POSTFIX CONFIGURATION.
# No installation command, service activation or live configuration is included.
# BLOCKER: the admission Milter and trusted local admission-ticket consumer are
# not implemented or installed. This file does not turn an arbitrary header
# into trusted_ingress. A new test recipient outside IT needs separate approval.
# Review fragments below belong to DIFFERENT files; never copy this entire file
# to main.cf or master.cf. Preserve the real Plesk configuration and all Milters.

# A. Intended public ingress (existing public IP:25, not a second listener).
# Keep the existing Plesk smtp inet master entry and Plesk Milter at 12768.
# Keep main.cf content_filter empty and the existing global relayhost/maps.
# Do NOT replace smtpd_milters, smtpd_relay_restrictions, relay_domains or
# smtpd_recipient_restrictions with a blanket Microsoft-network permit.
# A header_checks FILTER alone cannot reject messages with a MISSING secret.
# Admission BEFORE the final SMTP 250 is mandatory for every transit recipient.
#
# Intended new Milter socket (NOT IMPLEMENTED):
#   inet:127.0.0.1:12769
# Its contract is in PLESK-ADMISSION.md. The final smtpd_milter_maps / restriction
# merge must be generated from a fresh Plesk snapshot AFTER this daemon exists.
# No permissive ingress fragment is supplied while that gate is missing.

# B. Intended main.cf additions, after admission implementation and approval.
# Merge milter_header_checks with any existing table; do not overwrite it.
# Milter-added header checks, unlike ordinary header_checks, are applied only
# to headers added by a Milter. Incoming copies must be rejected by admission.
#
# milter_header_checks = pcre:/etc/postfix/railtime/milter-header-checks
# railtime-filter_destination_recipient_limit = 1
#
# /etc/postfix/railtime/milter-header-checks (review syntax):
# /^X-RailTime-Local-Admission: e3p1; ticket=[0-9a-f]{64}$/ FILTER railtime-filter:admitted
#
# The ticket is a random local lookup identifier, NOT the Exchange secret.
# A ticket exists only after admission. Pipe must independently verify its
# queue-id, client, sender, single IT recipient, input binding and state.

# C. Intended master.cf entries. All are COMMENTED and have missing callers.
# These entries do not grant public relay access and do not replace smtp/25.
#
# railtime-filter unix - n n - 2 pipe
#   eol=\r\n null_sender= user=railtime-transit
#   argv=/opt/railtime-transit/bin/railtime-filter
#     --queue-id ${queue_id} --client-address ${client_address}
#     --sender ${sender} -- ${recipient}
#
# MISSING: /opt/railtime-transit/bin/railtime-filter is the production queue
# caller, NOT railtime_transit_offline.py. It must verify the admission ticket,
# capture original input privately, resolve the exact B1 send projection, call
# E2, complete control headers, and submit to the fixed reinjection endpoint.
# Do not enable this entry merely because the offline transformer exists.
# No B/D/F/O/R flags: they add/alter message data. eol=\r\n is required because
# pipe defaults to LF. No shell interpolation, sendmail -t or header-derived RCPT.
# Null envelope senders cannot satisfy the IT pilot gate and are not transformed.

# D. Intended loopback-only reinjection, no repeated HTML or admission filtering.
# A pure SMTP return transport is deliberately stored as the queued route.
# Merely setting -o relayhost on smtpd is not the routing contract.
#
# 127.0.0.1:10027 inet n - n - 2 smtpd
#   -o syslog_name=postfix/railtime-reinject
#   -o content_filter=railtime-return:[railtime-de01b.mail.protection.outlook.com]:25
#   -o receive_override_options=no_unknown_recipient_checks,no_header_body_checks,no_milters
#   -o smtpd_milters=
#   -o smtpd_client_restrictions=permit_mynetworks,reject
#   -o smtpd_helo_restrictions=
#   -o smtpd_sender_restrictions=
#   -o smtpd_relay_restrictions=permit_mynetworks,reject
#   -o smtpd_recipient_restrictions=permit_mynetworks,reject
#   -o mynetworks=127.0.0.1/32
#   -o smtpd_sasl_auth_enable=no
#
# Required before use: isolate listener access to the queue caller's OS identity
# (or an equivalent authenticated local handoff). Loopback alone is not a user
# authorization boundary on a shared Plesk host. No Internet bind / NAT exposure.
# All recipients remain exactly the already admitted envelope recipients (IT).

# E. Intended dedicated SMTP return transport, no foreign-recipient MX lookup.
#
# railtime-return unix - - n - 2 smtp
#   -o syslog_name=postfix/railtime-return
#   -o smtp_tls_security_level=secure
#   -o smtp_tls_secure_cert_match=nexthop
#   -o smtp_tls_CAfile=/etc/ssl/certs/ca-certificates.crt
#   -o smtp_tls_cert_file=/etc/postfix/postfix.pem
#   -o smtp_tls_key_file=/etc/postfix/postfix.pem
#   -o disable_mime_output_conversion=yes
#
# Certificate paths and key access MUST be rechecked, not inferred from the
# public smtpd certificate. The outbound SMTP client must present the certificate
# expected by the Exchange return connector, with proven tenant attribution.
# The current plesk.follow-flow.de certificate's accepted-domain/tenant binding
# is unproved. No blanket OnPremises/Partner/wildcard connector is assumed safe.
# STARTTLS encrypt alone is insufficient; secure verifies the server identity.

# F. Queue semantics (contract, no settings changed).
# Live read-only preflight reported by root, 2026-11-04:
#   Postfix 3.8.6; message_size_limit=10240000 bytes
#   queue_run_delay=300s; minimal_backoff_time=300s
#   maximal_backoff_time=4000s; maximal_queue_lifetime=5d
# These are observed values, not new global settings for other Plesk mail.
# Infrastructure/spool/ticket/reinjection failure -> exit 75 / EX_TEMPFAIL.
# Content-level unsupported input -> original MIME payload + safe header
# completion, then the SAME fixed return path. No secret may leave the gateway.
# Stopped/crashed pipe -> deferred queue; no automatic direct-delivery bypass.
# Exit 0 only after a positive durable reinjection acknowledgement.
# Admission failure BEFORE SMTP250 -> reject/tempfail, not an after-queue bounce.
# SMTP ambiguity after downstream acceptance can cause duplicate delivery;
# retain Message-ID and journal states without claiming general exactly-once.

