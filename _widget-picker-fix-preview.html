<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Picker-Fix-Vorschau (temporär, wird wieder gelöscht)</title>
<link rel="stylesheet" href="/resources/css/operations-workspace.css">
<style>body{margin:0;padding:24px;background:#f2f5f9;font-family:sans-serif;} .widget-grid{min-height:120px;background:#fff;border:1px dashed #ccc;padding:12px;}</style>
</head>
<body>
  <div class="rt-ops ops-stack" data-dashboard-widget-grid x-data="{ pickerOpen: false, editing: false }" @keydown.escape.window="pickerOpen = false">
    <header class="ops-toolbar">
      <div><h1>Test</h1></div>
      <div class="ops-actions">
        <button type="button" class="ops-btn" x-show="editing" @click="pickerOpen = true" id="addBtn">+ Widget hinzufügen</button>
        <button type="button" class="ops-btn" :class="{'is-active': editing}" @click="editing = !editing; pickerOpen = false" id="toggleBtn" x-text="editing ? 'Fertig' : 'Dashboard anpassen'"></button>
      </div>
    </header>
    <div class="widget-grid" id="grid"><button id="innerCard" onclick="document.getElementById('clickResult').textContent = 'KARTE WURDE GEKLICKT um ' + Date.now();">Karte (klickbar testen)</button></div>
    <p id="clickResult" style="font-family:monospace;"></p>
    <div class="widget-sidebar-backdrop" :class="{ 'is-open': pickerOpen }" @click="pickerOpen = false"></div>
    <aside class="widget-sidebar" :class="{ 'is-open': pickerOpen }" :aria-hidden="(!pickerOpen).toString()">
      <div class="widget-sidebar-head"><div><h2>Widget hinzufügen</h2></div><button type="button" class="widget-sidebar-close" @click="pickerOpen = false">X</button></div>
      <div class="widget-sidebar-body">Picker-Inhalt (Beispiel)</div>
    </aside>
  </div>
<script type="module">
  import Alpine from 'alpinejs';
  window.Alpine = Alpine;
  Alpine.start();
</script>
</body>
</html>
