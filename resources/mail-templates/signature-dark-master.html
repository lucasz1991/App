<!doctype html>
<html lang="de" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>{{FIRMENNAME}} Signatur · Dunkel</title>
  <style>
    table, td { border-collapse: collapse; }
    img { border: 0; display: block; outline: none; }
    @media only screen and (max-width: 620px) {
      /* Nur die direkten Zellen der markierten Zeile brechen um — ein
         Nachfahren-Selektor wuerde auch die Kontakttabelle zerlegen. */
      tr.rt-stack > td { box-sizing: border-box !important; display: block !important; width: 100% !important; }
      /* Schutzregel: Symbol und Kontaktzeile bleiben nebeneinander. */
      .rt-contact { width: auto !important; }
      .rt-contact td.rt-contact-icon, .rt-contact td.rt-contact-text { display: table-cell !important; box-sizing: content-box !important; }
      .rt-contact td.rt-contact-icon { width: 22px !important; }
      .rt-contact td.rt-contact-text { width: auto !important; font-size: 13px !important; line-height: 19px !important; }
      /* Die Markenspalte steht in der Quelle zuerst und landet beim Stapeln
         oben. Die Trennlinie wandert deshalb von links nach unten. */
      .rt-sign-logo { border-left: 0 !important; border-bottom: 1px solid #303844 !important; padding: 0 0 17px !important; text-align: left !important; }
      .rt-sign-logo img { margin-left: 0 !important; width: 190px !important; }
      .rt-sign-identity { padding: 17px 0 0 !important; }
      /* Anschrift: breit in der Markenspalte (kostet dort keine Hoehe),
         schmal am Ende des Personenblocks (bessere Lesefolge). */
      .rt-only-wide { display: none !important; max-height: 0 !important; overflow: hidden !important; }
      .rt-only-narrow { display: block !important; max-height: none !important; overflow: visible !important; font-size: 11px !important; line-height: 18px !important; }
      /* Mobil steht die Signatur gestapelt und damit hoeher — dort darf
         der Zug groesser wirken. Der Streifen selbst ist auf Desktop
         ausgelegt (flach), diese Regel holt die mobile Groesse zurueck. */
      .rt-sign-cell { background-size: 125% auto !important; }
    }
  </style>
</head>
<body bgcolor="#0c1017" style="margin:0;padding:0;background:#0c1017;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="720" border="0" cellspacing="0" cellpadding="0" bgcolor="#0c1017" style="width:100%;max-width:720px;border-collapse:collapse;background:#0c1017;border-top:5px solid #e4002b;">
    <!-- Signatur und Pflichtangaben aus der gemeinsamen Quelle
         resources/views/emails/parts/signature.blade.php. -->
    {{SIGNATURE_BLOCK}}
  </table>
</body>
</html>
