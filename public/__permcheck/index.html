<!doctype html><meta charset="utf-8"><title>Permission-Check</title>
<body style="font:14px system-ui;padding:2rem">
<h1>RailTime — Berechtigungs-Diagnose</h1>
<pre id="out">läuft…</pre>
<script type="module">
const DEVICE_KIND = { microphone: 'audioinput', camera: 'videoinput' };
async function readDeviceState(kind) {
  if (!navigator.mediaDevices?.getUserMedia) return 'unsupported';
  let viaQuery = 'n/a';
  try { viaQuery = (await navigator.permissions.query({name:kind})).state; } catch(e){ viaQuery = 'wirft: '+e.name; }
  let viaDevices = 'n/a';
  try {
    const d = await navigator.mediaDevices.enumerateDevices();
    const m = d.filter(x => x.kind === DEVICE_KIND[kind]);
    viaDevices = m.length === 0 ? 'kein Geraet'
      : (m.some(x => x.label !== '') ? 'granted (Label vorhanden)' : 'prompt (Label leer)');
  } catch(e){ viaDevices = 'Fehler: '+e.name; }
  return { viaQuery, viaDevices };
}
const out = document.getElementById('out');
const res = {
  userAgent: navigator.userAgent,
  secureContext: window.isSecureContext,
  hasGetUserMedia: !!navigator.mediaDevices?.getUserMedia,
  hasPermissionsAPI: !!navigator.permissions?.query,
  notifications: ('Notification' in window) ? Notification.permission : 'unsupported',
  microphone: await readDeviceState('microphone'),
  camera: await readDeviceState('camera'),
};
out.textContent = JSON.stringify(res, null, 2);
</script>
